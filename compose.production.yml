name: ai-interview-practice

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: interview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-storage:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env.production}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env.production}
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >
        ollama pull ${OLLAMA_MODEL:-llama3.2:3b} &&
        ollama run ${OLLAMA_MODEL:-llama3.2:3b} 'Return exactly this JSON: {"action":"advance","text":""}' --verbose=false
    restart: "no"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: ${APP_ENV_FILE:-.env.production}
    environment: &backend-environment
      ENV: production
      DATABASE_URL: postgresql+asyncpg://interview:${POSTGRES_PASSWORD}@postgres:5432/interview
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://object-storage:9000
      PIPER_VOICES_DIR: /home/app/.local/share/piper-voices
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment: *backend-environment
    volumes:
      - whisper_models:/home/app/.cache/huggingface
      - piper_voices:/home/app/.local/share/piper-voices
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment: *backend-environment
    command: ["arq", "app.workers.settings.WorkerSettings"]
    healthcheck:
      disable: true
    volumes:
      - whisper_models:/home/app/.cache/huggingface
      - piper_voices:/home/app/.local/share/piper-voices
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
  whisper_models:
  piper_voices:
  ollama_data:
