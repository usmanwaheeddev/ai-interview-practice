[project]
name = "hiring-interview-backend"
version = "0.1.0"
description = "AI Hiring Platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "redis==5.2.1",
    "arq==0.26.1",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "boto3>=1.35.0",
    "structlog>=24.4.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "httpx>=0.27.0",
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# extend-exclude (not exclude) — exclude would replace ruff's default ignores
# (.venv, .git, __pycache__, …), not add to them. Alembic autogenerates
# versions/; don't hand-format vendor-shaped output.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's Depends()-as-default is the canonical DI pattern, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "WARNING"
markers = [
    "contract: hits real provider infra (Ollama/faster-whisper/Piper). Excluded by default — run explicitly with `-m contract`.",
]
addopts = "-m 'not contract'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
