services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hiring
      POSTGRES_PASSWORD: hiring
      POSTGRES_DB: hiring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiring -d hiring"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    # RustFS provides the S3-compatible API used for resumes and recordings
    # and publishes multi-architecture images for local development.
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      # Ollama unloads an idle model after its default 5m keep_alive, and
      # reloading it from disk on this CPU-only host takes ~90s — far past
      # application request timeouts, so any request after an idle gap can
      # fail. Keeping it resident indefinitely once
      # loaded avoids that cold-load path entirely.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pulls the model app/core/config.py's OLLAMA_MODEL (see .env)
  # expects into the `ollama` service's volume, so it's actually there the
  # first time something needs it — either as the local fallback in the
  # DeepSeek fallback or LLM_PROVIDER=ollama primary (see
  # app/providers/llm/fallback.py). Talks to the sibling `ollama`
  # service over HTTP rather than running its own server. Runs once per
  # `docker compose up`; a model already present is a fast no-op, so this
  # isn't worth gating api/worker startup on; DeepSeek remains the primary
  # while the local fallback is being prepared.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    # Pull, then immediately run a throwaway prompt so the model is loaded
    # into memory (and, with OLLAMA_KEEP_ALIVE=-1 on the `ollama` service,
    # stays there) before any real request arrives.
    command:
      - >
        ollama pull ${OLLAMA_MODEL:-llama3.2:3b} &&
        ollama run ${OLLAMA_MODEL:-llama3.2:3b} 'Return exactly this JSON: {"action":"advance","text":""}' --verbose=false
    restart: "no"

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hiring:hiring@postgres:5432/hiring
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://rustfs:9000
      # Override with OLLAMA_DOCKER_URL=http://host.docker.internal:11434
      # when using a native macOS Ollama process for Metal acceleration.
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://ollama:11434}
      PIPER_VOICES_DIR: /opt/piper-voices
    ports:
      - "8005:8000"
    volumes:
      - ./backend:/app
      - whisper_models:/root/.cache/huggingface
      - piper_voices:/opt/piper-voices
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hiring:hiring@postgres:5432/hiring
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://rustfs:9000
      # Keep API and worker on the same fallback endpoint. This also lets a
      # native macOS Ollama process serve background planning/scoring jobs.
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://ollama:11434}
      PIPER_VOICES_DIR: /opt/piper-voices
    volumes:
      - ./backend:/app
      - whisper_models:/root/.cache/huggingface
      - piper_voices:/opt/piper-voices
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.workers.settings.WorkerSettings

  web:
    # Frontend source is published separately; opt in only when available.
    profiles: ["frontend"]
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_PROXY_TARGET: http://api:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  rustfs_data:
  ollama_data:
  whisper_models:
  piper_voices:
